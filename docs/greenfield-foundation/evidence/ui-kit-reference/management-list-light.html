<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>NEXIAM UI kit — management list (light)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: {
  colors: { background:'#f4f3ef', foreground:'#2a3a2f', primary:{DEFAULT:'#2f7a4a',foreground:'#fff'}, muted:{DEFAULT:'#ebe8e0',foreground:'#6b756e'}, card:'#fff', border:'#ddd9d0', accent:'#d8eadc' },
  fontFamily: { sans: ['"IBM Plex Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
}}};
</script>
<style>
  body { font-family: "IBM Plex Sans", system-ui, sans-serif; color:#2a3a2f; background:
    radial-gradient(ellipse 90% 55% at 0% -5%, rgba(120,180,140,.45), transparent 55%),
    radial-gradient(ellipse 70% 45% at 100% 0%, rgba(230,210,160,.35), transparent 50%),
    linear-gradient(180deg,#faf9f6 0%,#f4f3ef 40%,#eef3ef 100%); background-attachment:fixed; min-height:100dvh; }
  summary::-webkit-details-marker { display:none; }
</style>
</head>
<body class="p-4 sm:p-6 lg:p-8">
  <div class="mx-auto max-w-5xl space-y-4 rounded-xl border border-border bg-white/80 p-4 shadow-sm sm:p-6">
    <div class="flex items-start justify-between gap-3">
      <p class="text-sm text-muted-foreground">View and manage applicants (static referral)</p>
      <div class="flex flex-wrap gap-2">
        <button class="inline-flex min-h-[44px] items-center gap-2 rounded-lg border border-border px-3 text-sm"><span aria-hidden="true">↑</span><span class="hidden sm:inline">Import</span></button>
        <button class="inline-flex min-h-[44px] items-center gap-2 rounded-lg bg-primary px-3 text-sm text-primary-foreground"><span aria-hidden="true">+</span><span class="hidden sm:inline">Create</span></button>
      </div>
    </div>

    <div class="rounded-lg border border-primary/30 bg-primary/5 px-4 py-3 text-sm"><strong>Online mode:</strong> Demo banner — resize below md for Filters panel.</div>

    <div class="flex flex-wrap items-end gap-3">
      <div class="relative min-w-0 flex-1 md:max-w-[220px] md:flex-none">
        <input type="search" placeholder="Search applicants…" class="h-10 w-full min-h-[44px] rounded-md border border-border bg-white pl-3 text-sm md:min-h-[40px]" />
      </div>
      <details class="relative md:hidden">
        <summary class="flex min-h-[44px] cursor-pointer list-none items-center gap-2 rounded-lg border border-border px-3 text-sm font-medium">Filters ▾</summary>
        <div class="absolute right-0 z-20 mt-1 w-[min(320px,calc(100vw-2rem))] space-y-3 rounded-lg border border-border bg-card p-4 shadow-lg">
          <label class="block text-sm font-medium">Status<select class="mt-1 w-full min-h-[44px] rounded-md border border-border px-2 text-sm"><option>All statuses</option><option>Pending</option></select></label>
          <label class="block text-sm font-medium">Season<select class="mt-1 w-full min-h-[44px] rounded-md border border-border px-2 text-sm"><option>Active season</option></select></label>
          <div class="grid grid-cols-2 gap-2"><input type="date" class="min-h-[44px] rounded-md border border-border px-2 text-sm" /><input type="date" class="min-h-[44px] rounded-md border border-border px-2 text-sm" /></div>
        </div>
      </details>
      <div class="hidden md:flex md:flex-wrap md:items-end md:gap-3">
        <div><label class="mb-1 block text-xs text-muted-foreground">Status</label><select class="min-h-[40px] w-[150px] rounded-md border border-border px-2 text-sm"><option>All statuses</option><option>Pending</option></select></div>
        <div><label class="mb-1 block text-xs text-muted-foreground">Season</label><select class="min-h-[40px] w-[200px] rounded-md border border-border px-2 text-sm"><option>Active season</option></select></div>
        <div><label class="mb-1 block text-xs text-muted-foreground">From</label><input type="date" class="min-h-[40px] rounded-md border border-border px-2 text-sm" /></div>
        <div><label class="mb-1 block text-xs text-muted-foreground">To</label><input type="date" class="min-h-[40px] rounded-md border border-border px-2 text-sm" /></div>
      </div>
    </div>

    <div class="flex flex-wrap items-center gap-3 rounded-lg border border-primary/20 bg-primary/5 px-4 py-3 text-sm">
      <span class="inline-flex h-6 min-w-[1.5rem] items-center justify-center rounded-full bg-primary px-1.5 text-xs font-bold text-primary-foreground">2</span>
      <span class="font-medium">selected</span>
      <span class="ml-auto flex flex-wrap gap-2">
        <button class="rounded-md bg-green-600 px-3 py-1.5 text-xs text-white">Accept</button>
        <button class="rounded-md bg-red-600/90 px-3 py-1.5 text-xs text-white">Dismiss</button>
        <button class="rounded-md px-3 py-1.5 text-xs text-muted-foreground">Clear</button>
      </span>
    </div>

    <div class="overflow-x-auto rounded-lg border border-border">
      <table class="min-w-[640px] w-full text-left text-sm">
        <thead class="bg-muted/50 text-xs uppercase text-muted-foreground"><tr><th class="px-3 py-3">☐</th><th class="px-4 py-3">Name</th><th class="px-4 py-3">Email</th><th class="px-4 py-3">Status</th></tr></thead>
        <tbody>
          <tr class="border-t border-border/50"><td class="px-3 py-3">☑</td><td class="px-4 py-3 font-medium">A. Dela Cruz</td><td class="px-4 py-3 text-muted-foreground">a@example.test</td><td class="px-4 py-3"><span class="rounded-md bg-accent px-2 py-0.5 text-xs">pending</span></td></tr>
          <tr class="border-t border-border/50"><td class="px-3 py-3">☐</td><td class="px-4 py-3 font-medium">B. Santos</td><td class="px-4 py-3 text-muted-foreground">b@example.test</td><td class="px-4 py-3"><span class="rounded-md bg-accent px-2 py-0.5 text-xs">accepted</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
