# NEXIAM Production Compose Overrides
# Extends compose.yaml: provides Nginx reverse proxy, static asset offloading,
# disables direct external port exposure on app, sets production environment flags.
#
# Usage:
#   docker compose -f compose.yaml -f compose.prod.yaml up -d
name: nexiam-system

services:
    app:
        environment:
            APP_ENV: production
            APP_DEBUG: 'false'
        ports: !override []
        expose:
            - '8000'

    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped
        stop_grace_period: 15s
        ports:
            - '${PRODUCTION_HTTP_PORT:-80}:80'
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro
            - app_storage:/var/www/html/storage:ro
        depends_on:
            app:
                condition: service_healthy
        logging:
            driver: 'json-file'
            options:
                max-size: '20m'
                max-file: '5'
        healthcheck:
            test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/up || exit 1']
            interval: 10s
            timeout: 3s
            retries: 3
