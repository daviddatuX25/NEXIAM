name: nexiam-system

services:
    app:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                APP_KEY: ${APP_KEY}
        env_file:
            - .env
        environment:
            APP_NAME: NEXIAM System
            APP_ENV: local
            APP_DEBUG: 'true'
            APP_URL: http://localhost:18000
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: nexiam
            DB_USERNAME: nexiam
            DB_PASSWORD: nexiam-local-only
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            MAIL_MAILER: smtp
            MAIL_HOST: mailpit
            MAIL_PORT: 1025
            MAIL_FROM_ADDRESS: foundation@nexiam.test
            MAIL_FROM_NAME: NEXIAM
            OMR_WORKER_ENABLED: ${OMR_WORKER_ENABLED:-true}
            OMR_WORKER_ENDPOINT: ${OMR_WORKER_ENDPOINT:-http://inference:8100}
            OMR_WORKER_SIGNING_SECRET: ${OMR_WORKER_SIGNING_SECRET:-nexiam-local-omr-worker-signing-secret-change-me}
            OMR_WORKER_ENGINE_NAME: OMRChecker
            OMR_WORKER_ENGINE_COMMIT: de3f6982822895491be760325fd43e65e90fa293
            OMR_WORKER_PATCH_IDENTITY: nexiam-headless-overlay-v1
        depends_on:
            postgres:
                condition: service_healthy
            mailpit:
                condition: service_started
            inference:
                condition: service_healthy
        ports:
            - '18000:8000'
        volumes:
            - .:/var/www/html
            - app_storage:/var/www/html/storage
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/up']
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s
    queue:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
            args:
                APP_KEY: ${APP_KEY}
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--sleep=1',
                '--tries=1',
                '--timeout=80',
            ]
        restart: unless-stopped
        env_file:
            - .env
        environment:
            APP_NAME: NEXIAM System
            APP_ENV: local
            APP_DEBUG: 'true'
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: nexiam
            DB_USERNAME: nexiam
            DB_PASSWORD: nexiam-local-only
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            OMR_WORKER_ENABLED: ${OMR_WORKER_ENABLED:-true}
            OMR_WORKER_ENDPOINT: ${OMR_WORKER_ENDPOINT:-http://inference:8100}
            OMR_WORKER_SIGNING_SECRET: ${OMR_WORKER_SIGNING_SECRET:-nexiam-local-omr-worker-signing-secret-change-me}
            OMR_WORKER_ENGINE_NAME: OMRChecker
            OMR_WORKER_ENGINE_COMMIT: de3f6982822895491be760325fd43e65e90fa293
            OMR_WORKER_PATCH_IDENTITY: nexiam-headless-overlay-v1
        depends_on:
            postgres:
                condition: service_healthy
            app:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - app_storage:/var/www/html/storage
        healthcheck:
            test: ['CMD-SHELL', "pgrep -f 'queue:work' >/dev/null"]
            interval: 10s
            timeout: 3s
            retries: 5

    scheduler:
        build:
            context: .
            dockerfile: docker/php/Dockerfile
        command: ['php', 'artisan', 'schedule:work']
        env_file:
            - .env
        environment:
            APP_NAME: NEXIAM System
            APP_ENV: local
            APP_DEBUG: 'true'
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: nexiam
            DB_USERNAME: nexiam
            DB_PASSWORD: nexiam-local-only
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: database
        depends_on:
            postgres:
                condition: service_healthy
            app:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - app_storage:/var/www/html/storage
        healthcheck:
            test: ['CMD-SHELL', "pgrep -f 'schedule:work' >/dev/null"]
            interval: 10s
            timeout: 3s
            retries: 5

    postgres:
        image: postgres:16-alpine
        environment:
            POSTGRES_DB: nexiam
            POSTGRES_USER: nexiam
            POSTGRES_PASSWORD: nexiam-local-only
        ports:
            - '5432:5432'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U nexiam -d nexiam']
            interval: 5s
            timeout: 3s
            retries: 10

    mailpit:
        image: axllent/mailpit:v1.21
        ports:
            - '18025:8025'
            - '11025:1025'

    inference:
        build:
            context: docker/inference
        environment:
            OMR_WORKER_SIGNING_SECRET: ${OMR_WORKER_SIGNING_SECRET:-nexiam-local-omr-worker-signing-secret-change-me}
            OMR_WORKER_CHILD_TIMEOUT_SECONDS: ${OMR_PROVIDER_DEADLINE_SECONDS:-30}
            OMR_WORKER_MAX_CONCURRENCY: ${OMR_WORKER_MAX_CONCURRENCY:-2}
        read_only: true
        tmpfs:
            - /tmp:size=64m,mode=1777
        cap_drop: ['ALL']
        security_opt:
            - no-new-privileges:true
        pids_limit: 64
        mem_limit: 768m
        cpus: 1.0
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'python -c ''import urllib.request; urllib.request.urlopen("http://127.0.0.1:8100/health/ready")''',
                ]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    app_storage:
    postgres_data:
