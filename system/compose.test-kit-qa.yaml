name: nexiam-test-kit-qa

services:
    test-kit-qa-app:
        profiles: ['test-kit-qa']
        image: nexiam-system-app
        pull_policy: never
        command: ['php', 'artisan', 'serve', '--host=0.0.0.0', '--port=8000', '--no-reload']
        env_file:
            - .env
        environment:
            APP_NAME: NEXIAM Test Kit QA
            APP_ENV: local
            APP_DEBUG: 'false'
            APP_URL: http://127.0.0.1:18440
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${TEST_KIT_QA_DATABASE:?Set TEST_KIT_QA_DATABASE to an isolated nexiam_test_kit_acceptance_* database}
            DB_USERNAME: nexiam
            DB_PASSWORD: nexiam-local-only
            DB_URL: ''
            APP_CONFIG_CACHE: /var/www/html/bootstrap/cache/test-kit-qa-config.php
            SESSION_DRIVER: database
            SESSION_COOKIE: nexiam_test_kit_browser_qa
            SESSION_DOMAIN: 127.0.0.1
            SESSION_SECURE_COOKIE: 'false'
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            TEST_KIT_BROWSER_QA: 'true'
            OMR_WORKER_ENABLED: 'true'
            OMR_WORKER_ENDPOINT: http://test-kit-qa-inference:8100
            OMR_WORKER_SIGNING_SECRET: ${OMR_WORKER_SIGNING_SECRET:-nexiam-local-omr-worker-signing-secret-change-me}
            OMR_WORKER_ENGINE_NAME: OMRChecker
            OMR_WORKER_ENGINE_COMMIT: de3f6982822895491be760325fd43e65e90fa293
            OMR_WORKER_PATCH_IDENTITY: nexiam-explicit-bubble-positions-v1
        depends_on:
            postgres:
                condition: service_healthy
            test-kit-qa-inference:
                condition: service_healthy
        ports:
            - '127.0.0.1:18440:8000'
        volumes:
            - .:/var/www/html
            - test_kit_qa_storage:/var/www/html/storage
            - test_kit_qa_bootstrap_cache:/var/www/html/bootstrap/cache
            - test_kit_qa_public_build:/var/www/html/public/build
        healthcheck:
            test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:8000/up']
            interval: 5s
            timeout: 3s
            retries: 20
            start_period: 10s

    test-kit-qa-omr-verification-worker:
        profiles: ['test-kit-qa']
        image: nexiam-system-app
        pull_policy: never
        command:
            [
                'php',
                'artisan',
                'queue:work',
                '--queue=omr-verification',
                '--sleep=1',
                '--tries=1',
                '--timeout=80',
            ]
        restart: unless-stopped
        env_file:
            - .env
        environment:
            APP_NAME: NEXIAM Test Kit QA
            APP_ENV: local
            APP_DEBUG: 'false'
            APP_URL: http://127.0.0.1:18440
            DB_CONNECTION: pgsql
            DB_HOST: postgres
            DB_PORT: 5432
            DB_DATABASE: ${TEST_KIT_QA_DATABASE:?Set TEST_KIT_QA_DATABASE to an isolated nexiam_test_kit_acceptance_* database}
            DB_USERNAME: nexiam
            DB_PASSWORD: nexiam-local-only
            DB_URL: ''
            APP_CONFIG_CACHE: /var/www/html/bootstrap/cache/test-kit-qa-config.php
            SESSION_DRIVER: database
            SESSION_COOKIE: nexiam_test_kit_browser_qa
            SESSION_DOMAIN: 127.0.0.1
            SESSION_SECURE_COOKIE: 'false'
            CACHE_STORE: database
            QUEUE_CONNECTION: database
            FILESYSTEM_DISK: local
            TEST_KIT_BROWSER_QA: 'true'
            OMR_WORKER_ENABLED: 'true'
            OMR_WORKER_ENDPOINT: http://test-kit-qa-inference:8100
            OMR_WORKER_SIGNING_SECRET: ${OMR_WORKER_SIGNING_SECRET:-nexiam-local-omr-worker-signing-secret-change-me}
            OMR_WORKER_ENGINE_NAME: OMRChecker
            OMR_WORKER_ENGINE_COMMIT: de3f6982822895491be760325fd43e65e90fa293
            OMR_WORKER_PATCH_IDENTITY: nexiam-explicit-bubble-positions-v1
        depends_on:
            postgres:
                condition: service_healthy
            test-kit-qa-inference:
                condition: service_healthy
        volumes:
            - .:/var/www/html
            - test_kit_qa_storage:/var/www/html/storage
            - test_kit_qa_bootstrap_cache:/var/www/html/bootstrap/cache
            - test_kit_qa_public_build:/var/www/html/public/build
        healthcheck:
            test: ['CMD-SHELL', "pgrep -f 'queue:work.*omr-verification' >/dev/null"]
            interval: 10s
            timeout: 3s
            retries: 5

    test-kit-qa-inference:
        profiles: ['test-kit-qa']
        image: nexiam-system-inference
        pull_policy: never
        environment:
            OMR_WORKER_SIGNING_SECRET: ${OMR_WORKER_SIGNING_SECRET:-nexiam-local-omr-worker-signing-secret-change-me}
            OMR_WORKER_CHILD_TIMEOUT_SECONDS: ${OMR_PROVIDER_DEADLINE_SECONDS:-30}
            OMR_WORKER_MAX_CONCURRENCY: ${OMR_WORKER_MAX_CONCURRENCY:-2}
            OMR_RECTIFICATION_SHADOW_MODE: 'false'
        read_only: true
        tmpfs:
            - /tmp:size=64m,mode=1777
        cap_drop: ['ALL']
        security_opt:
            - no-new-privileges:true
        pids_limit: 64
        mem_limit: 768m
        cpus: 1.0
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'python -c ''import urllib.request; urllib.request.urlopen("http://127.0.0.1:8100/health/ready")''',
                ]
            interval: 5s
            timeout: 3s
            retries: 5

volumes:
    test_kit_qa_storage:
    test_kit_qa_bootstrap_cache:
    test_kit_qa_public_build:
