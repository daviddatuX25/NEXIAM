configs:
    document-recovery-synthetic-env:
        file: ./docker/recovery-synthetic.env
services:
    document-recovery:
        image: nexiam-system-app
        pull_policy: never
        profiles: ['document-recovery']
        working_dir: /var/www/html
        user: '${DOCUMENT_RECOVERY_UID:-1001}:${DOCUMENT_RECOVERY_GID:-1001}'
        command: ['sleep', 'infinity']
        read_only: true
        network_mode: none
        cap_drop: ['ALL']
        security_opt:
            - no-new-privileges:true
        pids_limit: 128
        mem_limit: 1024m
        cpus: 1.0
        environment:
            DOCUMENT_RECOVERY_SYNTHETIC_ENV: '1'
            APP_NAME: NEXIAM Document Recovery
            APP_ENV: testing
            APP_DEBUG: 'false'
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            APP_URL: 'http://127.0.0.1:${DOCUMENT_RECOVERY_PUBLIC_PORT:?DOCUMENT_RECOVERY_PUBLIC_PORT is required}'
            APP_CONFIG_CACHE: /tmp/document-recovery/cache/config.php
            APP_EVENTS_CACHE: /tmp/document-recovery/cache/events.php
            APP_ROUTES_CACHE: /tmp/document-recovery/cache/routes.php
            APP_SERVICES_CACHE: /tmp/document-recovery/cache/services.php
            APP_PACKAGES_CACHE: /tmp/document-recovery/cache/packages.php
            APP_MAINTENANCE_DRIVER: file
            APP_MAINTENANCE_STORE: file
            LARAVEL_STORAGE_PATH: /var/www/html/storage
            VIEW_COMPILED_PATH: /tmp/document-recovery/views
            DB_CONNECTION: sqlite
            DB_URL: ''
            DB_DATABASE: /var/www/html/storage/recovery.sqlite
            DB_HOST: ''
            DB_PORT: ''
            DB_USERNAME: ''
            DB_PASSWORD: ''
            DB_FOREIGN_KEYS: 'true'
            SESSION_DRIVER: file
            SESSION_LIFETIME: '120'
            SESSION_ENCRYPT: 'false'
            SESSION_COOKIE: 'nexiam_document_recovery_${DOCUMENT_RECOVERY_RUN_ID:?DOCUMENT_RECOVERY_RUN_ID is required}'
            SESSION_PATH: /
            SESSION_DOMAIN: ''
            SESSION_SECURE_COOKIE: 'false'
            SESSION_SAME_SITE: lax
            CACHE_STORE: file
            QUEUE_CONNECTION: database
            QUEUE_AFTER_COMMIT: 'true'
            FILESYSTEM_DISK: local
            MAIL_MAILER: array
            MAIL_FROM_ADDRESS: document-recovery@nexiam.test
            MAIL_FROM_NAME: NEXIAM Document Recovery
            BROADCAST_CONNECTION: log
            LOG_CHANNEL: stderr
            LOG_LEVEL: warning
            OMR_WORKER_ENABLED: 'false'
            OMR_WORKER_ENDPOINT: ''
            OMR_WORKER_SIGNING_SECRET: ''
            XIAM_AI_GATEWAY: fake
            XIAM_AI_PROVIDER: fake
            AWS_ACCESS_KEY_ID: ''
            AWS_SECRET_ACCESS_KEY: ''
            AWS_DEFAULT_REGION: ''
            AWS_BUCKET: ''
            AWS_URL: ''
            AWS_ENDPOINT: ''
            DOCUMENT_RECOVERY_MODE: '1'
            DOCUMENT_RECOVERY_RUN_ID: ${DOCUMENT_RECOVERY_RUN_ID:?DOCUMENT_RECOVERY_RUN_ID is required}
            DOCUMENT_RECOVERY_PUBLIC_PORT: ${DOCUMENT_RECOVERY_PUBLIC_PORT:?DOCUMENT_RECOVERY_PUBLIC_PORT is required}
            DOCUMENT_RECOVERY_EVIDENCE_PATH: /evidence
            DOCUMENT_RECOVERY_BUILD_DIGEST: ${DOCUMENT_RECOVERY_BUILD_DIGEST:?DOCUMENT_RECOVERY_BUILD_DIGEST is required}
            VITE_HOT_FILE: /tmp/document-recovery/no-public-hot
            HOME: /tmp/document-recovery-home
            XDG_CACHE_HOME: /tmp/document-recovery-home/cache
            XDG_CONFIG_HOME: /tmp/document-recovery-home/config
            XDG_DATA_HOME: /tmp/document-recovery-home/data
            TMPDIR: /tmp
            TMP: /tmp
            TEMP: /tmp
        configs:
            - source: document-recovery-synthetic-env
              target: /var/www/html/.env
              mode: 0444
        volumes:
            - type: bind
              source: .
              target: /var/www/html
              read_only: true
              bind:
                  create_host_path: false
            - type: bind
              source: ${DOCUMENT_RECOVERY_EVIDENCE_DIR:?DOCUMENT_RECOVERY_EVIDENCE_DIR is required}
              target: /evidence
              bind:
                  create_host_path: false
            - type: bind
              source: ${DOCUMENT_RECOVERY_BUILD_DIR:?DOCUMENT_RECOVERY_BUILD_DIR is required}
              target: /var/www/html/public/build
              read_only: true
              bind:
                  create_host_path: false
        tmpfs:
            - /var/www/html/storage:rw,noexec,nosuid,size=536870912,mode=1777
            - /var/www/html/bootstrap/cache:rw,noexec,nosuid,size=33554432,mode=1777
            - /tmp:rw,noexec,nosuid,size=536870912,mode=1777
        restart: 'no'
    document-recovery-tests:
        image: nexiam-system-app
        pull_policy: never
        profiles: ['document-recovery']
        working_dir: /var/www/html
        user: '${DOCUMENT_RECOVERY_UID:-1001}:${DOCUMENT_RECOVERY_GID:-1001}'
        command: ['php', '-v']
        read_only: true
        network_mode: none
        cap_drop: ['ALL']
        security_opt:
            - no-new-privileges:true
        pids_limit: 128
        mem_limit: 1024m
        cpus: 1.0
        environment:
            DOCUMENT_RECOVERY_SYNTHETIC_ENV: '1'
            APP_NAME: NEXIAM Document Recovery Tests
            APP_ENV: testing
            APP_DEBUG: 'false'
            APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
            APP_URL: http://localhost
            DB_CONNECTION: sqlite
            DB_URL: ''
            DB_DATABASE: ':memory:'
            DB_HOST: ''
            DB_PORT: ''
            DB_USERNAME: ''
            DB_PASSWORD: ''
            DB_FOREIGN_KEYS: 'true'
            SESSION_DRIVER: array
            CACHE_STORE: array
            QUEUE_CONNECTION: sync
            QUEUE_AFTER_COMMIT: 'true'
            FILESYSTEM_DISK: local
            MAIL_MAILER: array
            BROADCAST_CONNECTION: log
            LOG_CHANNEL: stderr
            LOG_LEVEL: warning
            OMR_WORKER_ENABLED: 'false'
            OMR_WORKER_ENDPOINT: ''
            OMR_WORKER_SIGNING_SECRET: ''
            XIAM_AI_GATEWAY: fake
            XIAM_AI_PROVIDER: fake
            HOME: /tmp/document-recovery-tests-home
            XDG_CACHE_HOME: /tmp/document-recovery-tests-home/cache
            XDG_CONFIG_HOME: /tmp/document-recovery-tests-home/config
            XDG_DATA_HOME: /tmp/document-recovery-tests-home/data
            TMPDIR: /tmp
            TMP: /tmp
            TEMP: /tmp
        configs:
            - source: document-recovery-synthetic-env
              target: /var/www/html/.env
              mode: 0444
        volumes:
            - type: bind
              source: .
              target: /var/www/html
              read_only: true
              bind:
                  create_host_path: false
        tmpfs:
            - /var/www/html/storage:rw,noexec,nosuid,size=536870912,mode=1777
            - /var/www/html/bootstrap/cache:rw,noexec,nosuid,size=33554432,mode=1777
            - /var/www/html/vendor/pestphp/pest-plugin-browser/.temp:rw,noexec,nosuid,size=67108864,mode=1777
            - /var/www/html/vendor/pestphp/pest/.temp:rw,noexec,nosuid,size=67108864,mode=1777
            - /tmp:rw,noexec,nosuid,size=536870912,mode=1777
        restart: 'no'
