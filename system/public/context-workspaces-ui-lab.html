<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Context workspaces · NEXIAM UI Lab</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: hsl(40 20% 97%);
      --surface: hsl(0 0% 100%);
      --surface-2: hsl(40 15% 92%);
      --surface-3: hsl(40 18% 95%);
      --ink: hsl(150 30% 14%);
      --ink-soft: hsl(150 12% 40%);
      --line: hsl(40 10% 83%);
      --line-strong: hsl(150 12% 67%);
      --pine: hsl(150 65% 32%);
      --pine-strong: hsl(151 61% 26%);
      --pine-ink: hsl(150 50% 9%);
      --pine-wash: hsl(150 37% 92%);
      --pine-wash-2: hsl(150 26% 96%);
      --amber: hsl(38 69% 37%);
      --amber-wash: hsl(42 78% 92%);
      --red: hsl(5 58% 42%);
      --red-wash: hsl(5 65% 95%);
      --blue: hsl(206 63% 39%);
      --blue-wash: hsl(205 70% 94%);
      --shadow: 0 8px 22px -16px hsl(150 30% 10% / .26);
      --radius: 8px;
      --radius-sm: 6px;
      --focus: 0 0 0 3px hsl(150 65% 32% / .24);
      --mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
      --sans: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --canvas: hsl(150 25% 6%);
      --surface: hsl(150 20% 9%);
      --surface-2: hsl(150 15% 14%);
      --surface-3: hsl(150 17% 11%);
      --ink: hsl(145 20% 92%);
      --ink-soft: hsl(150 10% 68%);
      --line: hsl(150 15% 21%);
      --line-strong: hsl(150 11% 38%);
      --pine: hsl(150 75% 40%);
      --pine-strong: hsl(150 70% 48%);
      --pine-ink: hsl(150 50% 5%);
      --pine-wash: hsl(150 24% 15%);
      --pine-wash-2: hsl(150 18% 12%);
      --amber: hsl(40 82% 66%);
      --amber-wash: hsl(40 40% 17%);
      --red: hsl(5 74% 70%);
      --red-wash: hsl(5 34% 17%);
      --blue: hsl(202 77% 70%);
      --blue-wash: hsl(204 30% 17%);
      --shadow: 0 9px 24px -17px hsl(0 0% 0% / .75);
      --focus: 0 0 0 3px hsl(150 75% 40% / .31);
    }

    * { box-sizing: border-box; }
    html { min-width: 320px; background: var(--canvas); scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.5 var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; }
    button, select, a { -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-decoration-thickness: 1px; text-underline-offset: 3px; }
    a:hover { text-decoration-color: var(--pine); }
    button { color: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }
    ::selection { background: var(--pine); color: var(--pine-ink); }
    .icon { display: inline-block; width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .icon.small { width: 15px; height: 15px; }
    .icon.large { width: 22px; height: 22px; }
    .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    .app-header {
      position: sticky;
      z-index: 30;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 2px 12px -12px hsl(150 30% 10% / .6);
    }
    .header-inner { max-width: 1480px; margin: 0 auto; padding: 0 28px; }
    .draft-notice {
      display: flex;
      min-height: 34px;
      padding: 8px 0;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid var(--line);
      color: var(--pine-strong);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .01em;
    }
    .notice-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pine); box-shadow: 0 0 0 3px var(--pine-wash); }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; min-height: 64px; padding: 9px 0; }
    .brand-lockup { display: flex; min-width: 0; align-items: center; gap: 12px; }
    .brand-mark { display: grid; width: 36px; height: 36px; place-items: center; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--pine-wash-2); color: var(--pine-strong); }
    .brand-copy { min-width: 0; }
    .brand-title { margin: 0; font-size: 15px; font-weight: 650; line-height: 1.25; letter-spacing: -.015em; }
    .brand-subtitle { margin: 3px 0 0; color: var(--ink-soft); font-size: 12px; }
    .header-actions { display: flex; align-items: center; gap: 10px; }
    .actor-label { display: inline-flex; align-items: center; gap: 7px; color: var(--ink-soft); font-size: 12px; white-space: nowrap; }
    .actor-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pine); }
    .theme-button, .button, .quiet-button, .tab-link, .nav-link, .variant-button {
      display: inline-flex;
      min-height: 40px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      font-size: 13px;
      font-weight: 550;
      text-decoration: none;
      transition: border-color .16s ease, background .16s ease, color .16s ease, transform .12s ease;
    }
    .theme-button:hover, .button:hover, .quiet-button:hover, .tab-link:hover, .nav-link:hover, .variant-button:hover { border-color: var(--line-strong); background: var(--surface-3); }
    .theme-button:active, .button:active, .quiet-button:active, .nav-link:active { transform: scale(.98); }
    .button.primary { border-color: var(--pine); background: var(--pine); color: var(--pine-ink); font-weight: 650; }
    .button.primary:hover { border-color: var(--pine-strong); background: var(--pine-strong); color: var(--pine-ink); }
    .button.subtle { border-color: transparent; background: transparent; }
    .button.danger { border-color: hsl(5 58% 42% / .35); color: var(--red); }
    .button:disabled { cursor: not-allowed; opacity: .56; transform: none; }
    .nav-scroll { overflow-x: auto; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
    .primary-nav { display: flex; width: max-content; min-width: 100%; align-items: center; gap: 3px; padding: 0 0 8px; }
    .nav-link { min-height: 38px; border-color: transparent; background: transparent; color: var(--ink-soft); white-space: nowrap; }
    .nav-link[aria-current="page"] { border-color: var(--line); background: var(--surface-2); color: var(--pine-strong); font-weight: 650; }

    .page { max-width: 1480px; margin: 0 auto; padding: 28px 28px 120px; }
    .page-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin: 0 0 22px; }
    .heading-copy { max-width: 74ch; }
    h1, h2, h3, h4, p { overflow-wrap: anywhere; }
    h1 { margin: 0; font-size: clamp(1.55rem, 2vw, 2rem); font-weight: 650; letter-spacing: -.027em; line-height: 1.18; }
    .page-description { margin: 8px 0 0; max-width: 70ch; color: var(--ink-soft); font-size: 14px; }
    h2 { margin: 0; font-size: 17px; font-weight: 650; letter-spacing: -.018em; line-height: 1.3; }
    h3 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: -.01em; line-height: 1.35; }
    .section-intro { margin: 5px 0 0; color: var(--ink-soft); font-size: 13px; }
    .panel { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .panel-pad { padding: 19px; }
    .panel-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
    .label-caps { color: var(--ink-soft); font-size: 12px; font-weight: 700; letter-spacing: .075em; text-transform: uppercase; }
    .muted { color: var(--ink-soft); }
    .small { font-size: 12px; }
    .mono, .number { font-family: var(--mono); font-variant-numeric: tabular-nums; }
    .status-pill, .tag, .count-pill, .audience-pill, .scope-pill {
      display: inline-flex; min-height: 24px; align-items: center; gap: 5px; padding: 2px 8px;
      border: 1px solid var(--line); border-radius: 999px; background: var(--surface-3); color: var(--ink-soft);
      font-size: 12px; font-weight: 600; line-height: 1.25; white-space: nowrap;
    }
    .audience-pill { max-width: 100%; white-space: normal; overflow-wrap: anywhere; }
    .thread-labels .audience-pill .icon { display: none; }
    .status-pill.green, .tag.green { border-color: hsl(150 48% 44% / .28); background: var(--pine-wash); color: var(--pine-strong); }
    .status-pill.amber, .tag.amber { border-color: hsl(38 69% 37% / .3); background: var(--amber-wash); color: var(--amber); }
    .status-pill.red, .tag.red { border-color: hsl(5 58% 42% / .3); background: var(--red-wash); color: var(--red); }
    .status-pill.blue, .tag.blue { border-color: hsl(206 63% 39% / .25); background: var(--blue-wash); color: var(--blue); }
    .field { display: grid; min-width: 0; gap: 6px; }
    .field label, .field-label { color: var(--ink); font-size: 12px; font-weight: 650; }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm);
      background: var(--surface); color: var(--ink); font-size: 13px;
    }
    textarea { min-height: 92px; resize: vertical; line-height: 1.5; }
    input::placeholder, textarea::placeholder { color: var(--ink-soft); opacity: .85; }
    .helper { margin: 0; color: var(--ink-soft); font-size: 12px; line-height: 1.45; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    .inline-note { padding: 12px 14px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-3); color: var(--ink-soft); font-size: 12px; }
    .inline-note strong { color: var(--ink); }
    .inline-note.target { border-color: hsl(38 69% 37% / .32); background: var(--amber-wash); color: var(--ink); }
    .inline-note.danger { border-color: hsl(5 58% 42% / .32); background: var(--red-wash); color: var(--ink); }
    .inline-note.success { border-color: hsl(150 48% 44% / .28); background: var(--pine-wash); color: var(--ink); }
    .inline-note .note-title { display: flex; align-items: center; gap: 7px; margin-bottom: 4px; font-weight: 650; }
    .inline-note p { margin: 0; }
    .stack { display: grid; gap: 16px; }
    .row { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; }
    .spread { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .divider { height: 1px; margin: 14px 0; background: var(--line); }
    .empty-state { padding: 28px 20px; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); color: var(--ink-soft); text-align: center; }
    .empty-state strong { display: block; margin-bottom: 5px; color: var(--ink); font-size: 14px; }
    .empty-state p { max-width: 45ch; margin: 0 auto; font-size: 12px; }
    .status-line { min-height: 20px; color: var(--ink-soft); font-size: 12px; }

    .organization-layout { display: grid; grid-template-columns: minmax(250px, .78fr) minmax(0, 1.55fr); gap: 18px; align-items: start; }
    .institution-panel { padding: 21px; background: var(--pine-wash-2); }
    .institution-seal { display: grid; width: 46px; height: 46px; place-items: center; margin-bottom: 16px; border: 1px solid var(--line-strong); border-radius: 7px; background: var(--surface); color: var(--pine-strong); }
    .institution-name { max-width: 16ch; margin: 8px 0 0; font-size: 21px; font-weight: 650; line-height: 1.2; letter-spacing: -.025em; }
    .institution-details { display: grid; gap: 12px; margin: 20px 0 0; padding: 0; list-style: none; }
    .institution-details li { display: flex; align-items: flex-start; gap: 9px; color: var(--ink-soft); font-size: 12px; }
    .institution-details .icon { color: var(--pine-strong); }
    .directory-panel { padding: 19px; }
    .department-list { display: grid; gap: 16px; }
    .department { padding-top: 14px; border-top: 1px solid var(--line); }
    .department:first-child { padding-top: 0; border-top: 0; }
    .department-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
    .program-links { display: grid; gap: 7px; }
    .program-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); text-align: left; }
    .program-row:hover { border-color: var(--pine); background: var(--pine-wash-2); }
    .program-row strong { display: block; font-size: 13px; font-weight: 650; }
    .program-row small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
    .program-code { color: var(--pine-strong); font: 600 12px/1 var(--mono); }
    .organization-a { grid-template-columns: minmax(245px, .78fr) minmax(0, 1.5fr); }
    .organization-b { grid-template-columns: minmax(250px, .78fr) minmax(0, 1.55fr); }
    .hierarchy-layout { display: grid; grid-template-columns: minmax(175px, .68fr) minmax(0, 1.32fr); gap: 14px; align-items: start; }
    .department-choices { display: grid; align-content: start; gap: 6px; }
    .department-choice { display: grid; gap: 3px; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); color: var(--ink); cursor: pointer; text-align: left; }
    .department-choice:hover { border-color: var(--pine); background: var(--pine-wash-2); }
    .department-choice[aria-current="true"] { border-color: var(--pine); background: var(--pine-wash); color: var(--pine-strong); }
    .department-choice strong { font-size: 12px; font-weight: 650; }
    .department-choice small { color: var(--ink-soft); font-size: 12px; }
    .selected-department { min-width: 0; padding: 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-3); }
    .selected-department .program-links { margin-top: 12px; }
    .organization-path { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-bottom: 12px; color: var(--ink-soft); font-size: 12px; }
    .organization-path strong { color: var(--pine-strong); font-weight: 650; }
    .organization-back { display: inline-flex; align-items: center; gap: 7px; color: var(--pine-strong); font-size: 12px; font-weight: 600; text-decoration: none; }
    .organization-back:hover { text-decoration: underline; }

    .overview-heading-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
    .scope-control { display: grid; min-width: 225px; gap: 5px; }
    .scope-control label { color: var(--ink-soft); font-size: 12px; font-weight: 600; }
    .summary-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; overflow: hidden; margin: 18px 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--line); }
    .summary-cell { min-width: 0; padding: 15px 17px; background: var(--surface); }
    .summary-cell dt { color: var(--ink-soft); font-size: 12px; }
    .summary-cell dd { margin: 5px 0 0; font: 600 24px/1.1 var(--mono); letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
    .summary-cell dd small { font: 500 12px/1 var(--sans); color: var(--ink-soft); }
    .data-table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .quota-table { width: 100%; border-collapse: collapse; text-align: left; }
    .quota-table th, .quota-table td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
    .quota-table th { background: var(--surface-3); color: var(--ink-soft); font-size: 12px; font-weight: 650; letter-spacing: .035em; }
    .quota-table td { font-size: 13px; }
    .quota-table tr:last-child td { border-bottom: 0; }
    .quota-table .program-name strong { display: block; font-size: 13px; }
    .quota-table .program-name small { color: var(--ink-soft); font-size: 12px; }
    .quota-table .number { font-size: 13px; }
    .table-link { display: inline-flex; min-height: 34px; align-items: center; gap: 6px; color: var(--pine-strong); font-size: 12px; font-weight: 650; text-decoration: none; white-space: nowrap; }
    .table-link:hover { text-decoration: underline; }

    .program-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 22px; padding: 19px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); }
    .program-head-main { min-width: 0; }
    .program-code-large { display: inline-flex; align-items: center; gap: 7px; margin-bottom: 7px; color: var(--pine-strong); font: 600 12px/1.3 var(--mono); letter-spacing: .03em; }
    .program-head h1 { font-size: clamp(1.45rem, 2vw, 1.85rem); }
    .program-head .page-description { margin-top: 6px; }
    .program-selectors { display: flex; min-width: 240px; flex-direction: column; gap: 9px; }
    .program-tabs { display: flex; gap: 4px; overflow-x: auto; margin: 13px 0 18px; padding: 0 0 7px; border-bottom: 1px solid var(--line); scrollbar-width: thin; }
    .tab-link { min-height: 37px; border-color: transparent; background: transparent; color: var(--ink-soft); white-space: nowrap; }
    .tab-link[aria-selected="true"] { border-color: var(--line); background: var(--surface); color: var(--pine-strong); box-shadow: 0 1px 3px hsl(150 20% 10% / .08); font-weight: 650; }
    .program-section { padding: 20px; }
    .overview-columns { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(250px, .75fr); gap: 16px; }
    .overview-facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 17px 0 0; }
    .overview-facts div { padding: 10px 0; border-top: 1px solid var(--line); }
    .overview-facts dt { color: var(--ink-soft); font-size: 12px; }
    .overview-facts dd { margin: 3px 0 0; font-size: 13px; font-weight: 600; }
    .quota-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; margin: 17px 0; }
    .quota-stat { padding: 13px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface-3); }
    .quota-stat dt { color: var(--ink-soft); font-size: 12px; }
    .quota-stat dd { margin: 5px 0 0; font: 600 22px/1.15 var(--mono); font-variant-numeric: tabular-nums; }
    .quota-editor { display: grid; gap: 13px; padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-3); }
    .suggestion-list { display: flex; flex-wrap: wrap; gap: 7px; }
    .suggestion { min-height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--ink-soft); cursor: pointer; font-size: 12px; }
    .suggestion:hover { border-color: var(--pine); color: var(--pine-strong); }
    .history-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
    .history-item { display: grid; grid-template-columns: minmax(100px, .45fr) minmax(0, 1fr); gap: 9px 16px; padding: 12px 0; border-top: 1px solid var(--line); }
    .history-item:first-child { border-top: 0; }
    .history-date { color: var(--ink-soft); font-size: 12px; }
    .history-detail strong { font-size: 12px; font-weight: 650; }
    .history-detail p { margin: 2px 0 0; color: var(--ink-soft); font-size: 12px; }
    .access-panel, .discussion-panel, .publication-preview { padding: 15px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface-3); }
    .access-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); }
    .access-row:first-of-type { margin-top: 10px; }
    .access-row strong { display: block; font-size: 12px; }
    .access-row small { display: block; margin-top: 2px; color: var(--ink-soft); font-size: 12px; }
    .discussion-message { padding: 12px 0; border-top: 1px solid var(--line); }
    .discussion-message:first-of-type { margin-top: 9px; }
    .discussion-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-soft); font-size: 12px; }
    .discussion-message p { margin: 5px 0 0; font-size: 12px; }
    .publication-list { display: grid; gap: 0; }
    .publication-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
    .publication-row:first-child { border-top: 0; }
    .publication-title { padding: 0; border: 0; background: none; color: var(--pine-strong); cursor: pointer; font-size: 14px; font-weight: 650; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
    .publication-row p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; }
    .publication-preview { margin-top: 14px; }
    .publication-preview .preview-body { margin: 11px 0 0; padding-top: 10px; border-top: 1px solid var(--line); font-size: 13px; white-space: pre-wrap; }
    .discussion-topic { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); }
    .discussion-topic:first-of-type { margin-top: 8px; }
    .discussion-topic p { margin: 4px 0 0; color: var(--ink-soft); font-size: 12px; }

    .case-banner { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 13px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
    .case-identity { min-width: 0; }
    .case-identity strong { display: block; font-size: 14px; font-weight: 650; }
    .case-identity span { display: block; margin-top: 3px; color: var(--ink-soft); font-size: 12px; }

      function renderQuotaOverview() {
        const cycleOptions = cycles.map((cycle) => ({ value: cycle.id, label: cycle.label }));
        const currentCycleData = programs.map((program) => ({ program, quota: findQuota(program.id, state.cycleId) }));
        const totals = currentCycleData.reduce((acc, row) => ({ capacity: acc.capacity + row.quota.capacity, committed: acc.committed + row.quota.committed }), { capacity: 0, committed: 0 });
        const remaining = Math.max(0, totals.capacity - totals.committed);
        return `<main class="page">
          ${heading('Quota overview', 'A read-only view across programs for the selected academic year and semester. Open a program to edit its quota in one canonical workspace.', `<div class="scope-control"><label for="overview-cycle">Academic year · Semester</label><select id="overview-cycle" data-control="overview-cycle">${cycleOptions.map((cycle) => `<option value="${cycle.value}" ${cycle.value === state.cycleId ? 'selected' : ''}>${escapeHtml(cycle.label)}</option>`).join('')}</select></div>`)}
          <section aria-label="Cycle totals">
            <div class="spread"><div><h2>${escapeHtml(currentCycle().label)}</h2><p class="section-intro">Authorized synthetic program quotas · overview only</p></div><span class="tag">No editor on this page</span></div>
            <dl class="summary-strip"><div class="summary-cell"><dt>Total capacity</dt><dd>${formatNumber(totals.capacity)} <small>slots</small></dd></div><div class="summary-cell"><dt>Committed applicants</dt><dd>${formatNumber(totals.committed)}</dd></div><div class="summary-cell"><dt>Remaining capacity</dt><dd>${formatNumber(remaining)}</dd></div></dl>
            <div class="data-table-wrap"><table class="quota-table"><thead><tr><th scope="col">Program</th><th scope="col">Capacity</th><th scope="col">Committed</th><th scope="col">Remaining</th><th scope="col"><span class="sr-only">Action</span></th></tr></thead><tbody>${currentCycleData.map(({ program, quota }) => `<tr><td class="program-name"><strong>${escapeHtml(program.name)}</strong><small>${escapeHtml(program.department)}</small></td><td class="number">${formatNumber(quota.capacity)}</td><td class="number">${formatNumber(quota.committed)}</td><td class="number">${formatNumber(quotaRemaining(quota))}</td><td><a class="table-link" href="${escapeHtml(urlFor({ screen: 'program-workspace', program: program.id, cycle: state.cycleId, tab: 'quota' }))}" data-action="open-program" data-program="${program.id}" data-tab="quota">Open quota ${icon('arrow', 'small')}</a></td></tr>`).join('')}</tbody></table></div>
            <p class="helper" style="margin-top:10px">Capacity changes belong in the selected program’s Quota tab. Discussion access never changes quota authority.</p>
          </section>
        </main>`;
      }

      function programTabs() {
        const tabs = [['overview', 'Overview'], ['quota', 'Quota'], ['discussions', 'Discussions'], ['announcements', 'Announcements'], ['policies', 'Policies'], ['benchmarks', 'Benchmarks']];
        return `<nav class="program-tabs" role="tablist" aria-label="Program workspace sections">${tabs.map(([id, label]) => `<a role="tab" class="tab-link" aria-selected="${state.programTab === id}" href="${escapeHtml(urlFor({ screen: 'program-workspace', tab: id }))}" data-tab="${id}">${escapeHtml(label)}</a>`).join('')}</nav>`;
      }

      function quotaEditor() {
        const program = currentProgram();
        const cycle = currentCycle();
        const quota = findQuota();
        const key = quotaKey();
        const draft = state.quotaDrafts.get(key) ?? { capacity: String(quota.capacity), note: '' };
        const access = findRegistrarAccess();
        const historyRows = quota.history.slice(0, 8);
        const discussion = state.quotaDiscussionOpen ? findQuotaDiscussion() : [];
        return `<section class="stack" aria-label="Quota editor for ${escapeHtml(program.code)} ${escapeHtml(cycle.short)}">
          <div class="panel program-section">
            <div class="spread"><div><h2>Program quota</h2><p class="section-intro">Capacity and commitments for ${escapeHtml(program.code)} · ${escapeHtml(cycle.label)}.</p></div><span class="tag green">Canonical editor</span></div>
            <dl class="quota-stats"><div class="quota-stat"><dt>Capacity</dt><dd>${formatNumber(quota.capacity)}</dd></div><div class="quota-stat"><dt>Committed applicants</dt><dd>${formatNumber(quota.committed)}</dd></div><div class="quota-stat"><dt>Remaining capacity</dt><dd>${formatNumber(quotaRemaining(quota))}</dd></div></dl>
            ${quota.committed > quota.capacity ? `<div class="inline-note danger"><strong>Existing commitments exceed capacity by ${formatNumber(quota.committed - quota.capacity)}.</strong> Current commitments remain unchanged in this draft.</div>` : ''}
            <form class="quota-editor" data-form="quota">
              <div class="field-grid"><div class="field"><label for="quota-capacity">Capacity slots</label><input id="quota-capacity" type="number" inputmode="numeric" min="0" max="100000" step="1" required value="${escapeHtml(draft.capacity)}" data-control="quota-capacity"><p class="helper">Only the authorized quota editor changes this value.</p></div><div class="field"><label for="quota-note">Change note <span class="muted">· optional</span></label><textarea id="quota-note" maxlength="2000" rows="3" placeholder="Record why this capacity changed." data-control="quota-note">${escapeHtml(draft.note)}</textarea><p class="helper">The note is editable; suggestions below insert starting text.</p></div></div>
              <p class="helper">Prototype suggestions for future QA only; not shipped policy or quota guidance.</p>
              <div><span class="field-label">Note suggestions</span><div class="suggestion-list" style="margin-top:7px"><button class="suggestion" type="button" data-action="note-suggestion" data-text="Capacity reviewed against confirmed cycle commitments.">Reviewed against commitments</button><button class="suggestion" type="button" data-action="note-suggestion" data-text="Department capacity confirmed for this academic year and semester.">Department capacity confirmed</button></div></div>
              <div class="spread"><span class="helper">Save is in-memory only · scoped to ${escapeHtml(program.code)} and ${escapeHtml(cycle.short)}.</span><button class="button primary" type="submit">Save quota</button></div>
              <div class="status-line" id="quota-save-status" aria-live="polite"></div>
            </form>
          </div>
          <section class="panel program-section" aria-labelledby="quota-history-title"><div class="panel-header"><div><h2 id="quota-history-title">Quota change history</h2><p class="section-intro">Recent synthetic changes for ${escapeHtml(cycle.label)} · this preview shows at most eight rows.</p></div><span class="scope-pill">${historyRows.length} recent</span></div>${historyRows.length ? `<ol class="history-list">${historyRows.map((row) => `<li class="history-item"><span class="history-date">${escapeHtml(dateLabel(row.date))} · ${escapeHtml(timeLabel(row.date))}</span><div class="history-detail"><strong>${row.from === null ? 'Not set' : formatNumber(row.from)} → ${formatNumber(row.to)} slots · ${escapeHtml(row.actor)}</strong><p>${escapeHtml(row.note || 'No change note recorded.')}</p></div></li>`).join('')}</ol>` : `<div class="empty-state"><strong>No quota changes recorded</strong><p>Saved synthetic changes for this program and cycle will appear here.</p></div>`}</section>
          <section class="panel program-section"><div class="spread"><div><h2>Quota discussion</h2><p class="section-intro">A separate thread for this program and cycle. Discussion does not mutate capacity.</p></div><button class="quiet-button" type="button" data-action="toggle-quota-discussion" aria-expanded="${state.quotaDiscussionOpen}">${state.quotaDiscussionOpen ? 'Close discussion' : 'Open thread discussion'} ${icon('chevron', 'small')}</button></div>${state.quotaDiscussionOpen ? `<div class="discussion-panel" style="margin-top:13px"><div class="spread"><div><span class="label-caps">Quota governance thread</span><p class="helper">${escapeHtml(program.code)} · ${escapeHtml(cycle.label)} · staff-governed discussion</p></div><span class="tag">No quota write rights</span></div>${discussion.map((message) => `<article class="discussion-message"><div class="discussion-meta"><strong>${escapeHtml(message.sender)}</strong><time datetime="${escapeHtml(message.time)}">${escapeHtml(dateLabel(message.time))} · ${escapeHtml(timeLabel(message.time))}</time></div><p>${escapeHtml(message.body)}</p></article>`).join('')}<form class="field" data-form="quota-discussion" style="margin-top:12px"><label for="quota-discussion-reply">Add a discussion reply</label><textarea id="quota-discussion-reply" rows="2" maxlength="8000" placeholder="Write within the quota discussion thread…" data-control="quota-discussion-draft">${escapeHtml(state.quotaDiscussionDraft)}</textarea><div class="spread"><p class="helper">Adds only a discussion message; it cannot change capacity.</p><button class="button" type="submit">Add reply</button></div></form></div>` : `<p class="helper" style="margin-top:12px">The thread is opened on demand. It remains separate from the quota editor and its change history.</p>`}</section>
          <section class="panel program-section" aria-labelledby="registrar-controls-title"><div class="spread"><div><h2 id="registrar-controls-title">Registrar access</h2><p class="section-intro">One recipient-specific quota-governance grant, scoped to a program and academic cycle.</p></div><button class="quiet-button" type="button" data-action="toggle-registrar-controls" aria-expanded="${state.registrarControlsOpen}">${state.registrarControlsOpen ? 'Close controls' : 'Open access controls'} ${icon('lock', 'small')}</button></div>${state.registrarControlsOpen ? `<div class="access-panel" style="margin-top:13px"><div class="inline-note"><strong>${escapeHtml(registrarRecipient.name)} · ${escapeHtml(registrarRecipient.office)} recipient</strong><p>Scope: ${escapeHtml(program.code)} · ${escapeHtml(cycle.label)}. This one grant bundles quota read, quota-history read, quota-discussion read, and quota-discussion reply. It grants no quota edit or approval, applicant case, or benchmark rights.</p></div><div class="inline-note"><strong>${access.active ? 'Active bundled grant' : 'No active grant'}</strong><p>Version ${access.version} · latest receipt ${escapeHtml(access.latestReceiptId ?? 'none')} · ${access.active ? 'active' : 'revoked'}</p><p>Grant state and history are synthetic and in memory only.</p></div><form class="quota-editor" data-form="registrar-grant" data-version="${access.version}"><div class="field"><label for="registrar-grant-reason">Required reason</label><textarea id="registrar-grant-reason" name="reason" maxlength="2000" rows="2" required placeholder="Record why this bundled grant is being issued or revoked."></textarea></div><div class="row"><button class="button primary" type="submit" name="grant-action" value="issue" ${access.active ? 'disabled' : ''}>Issue bundled grant</button><button class="button danger" type="submit" name="grant-action" value="revoke" ${!access.active ? 'disabled' : ''}>Revoke bundled grant</button></div></form><h3 style="margin-top:14px">Version receipts and history</h3>${access.history.length ? `<ol class="history-list">${[...access.history].reverse().map((receipt) => `<li class="history-item"><span class="history-date">Version ${receipt.version} · ${escapeHtml(dateLabel(receipt.date))} · ${escapeHtml(timeLabel(receipt.date))}</span><div class="history-detail"><strong>${escapeHtml(receipt.action)} · ${escapeHtml(receipt.receiptId)} · ${escapeHtml(receipt.actor)}</strong><p>${escapeHtml(receipt.reason)}</p></div></li>`).join('')}</ol>` : `<div class="empty-state"><strong>No grant history for this scope</strong><p>Issue or revoke the bundled grant with a reason to append a version receipt.</p></div>`}</div>` : `<p class="helper" style="margin-top:12px">Recipient and grant history are scoped to this program and cycle. The grant does not provide quota editing, applicant case, or benchmark access.</p>`}</section>
        </section>`;
      }

      function programOverview() {
        const program = currentProgram();
        const quota = findQuota();
        return `<section class="panel program-section"><div class="overview-columns"><div><span class="label-caps">Program overview</span><h2 style="margin-top:6px">${escapeHtml(program.name)}</h2><p class="section-intro">${escapeHtml(program.description)}</p><dl class="overview-facts"><div><dt>Department</dt><dd>${escapeHtml(program.department)}</dd></div><div><dt>Academic year · semester</dt><dd>${escapeHtml(currentCycle().label)}</dd></div><div><dt>Program code</dt><dd class="mono">${escapeHtml(program.code)}</dd></div><div><dt>Quota context</dt><dd>${formatNumber(quota.capacity)} capacity · ${formatNumber(quota.committed)} committed</dd></div></dl></div><aside class="inline-note"><div class="note-title">${icon('info', 'small')} Program workspace</div><p>Announcements and policies are published content. They are not conversation messages. Quota decisions are recorded in the Quota tab; discussions do not approve them.</p><div class="row" style="margin-top:12px"><a class="table-link" href="${escapeHtml(urlFor({ tab: 'quota' }))}" data-tab="quota">Open quota ${icon('arrow', 'small')}</a><a class="table-link" href="${escapeHtml(urlFor({ screen: 'applicant-workspace' }))}" data-screen="applicant-workspace">Applicant workspace ${icon('arrow', 'small')}</a></div></aside></div></section>`;
      }

      function programDiscussions() {
        const topics = findProgramDiscussion();
        const activeIndex = state.programDiscussionIndex;
        const active = activeIndex === null ? null : topics[activeIndex] ?? null;
        const newDraft = state.programNewDiscussionDrafts.get(programNewDiscussionDraftKey()) ?? { subject: '', body: '' };
        const replyDraft = active ? state.programDiscussionReplyDrafts.get(programDiscussionDraftKey(active.id)) ?? '' : '';
        return `<section class="panel program-section"><div class="panel-header"><div><h2>Program discussions</h2><p class="section-intro">Staff coordination scoped to ${escapeHtml(currentProgram().code)} · ${escapeHtml(currentCycle().label)}.</p></div><div class="row"><span class="tag">Discussion only</span><button class="button" type="button" data-action="open-program-discussion-form" aria-expanded="${state.programNewDiscussionOpen}">${icon('plus', 'small')} New discussion</button></div></div><div class="inline-note"><strong>Separate from applicant messaging.</strong> These synthetic governance discussions have their own audience and context; they do not publish announcements, change policy, or mutate quota.</div>${state.programNewDiscussionOpen ? `<form class="new-thread-form" data-form="program-new-discussion" style="margin-top:12px"><h3>New program governance discussion</h3><span class="tag amber">Target behavior · atomic backend creation required</span><p class="helper">Governance threads open subject-only today. The target creates the subject and first message in one backend transaction; this is a synthetic preview only.</p><div class="field"><label for="program-discussion-subject">Subject</label><input id="program-discussion-subject" type="text" required placeholder="Name the program or cycle topic" value="${escapeHtml(newDraft.subject)}" data-control="program-discussion-subject"><p class="helper">Subject length and validation remain domain-specific backend decisions.</p></div><div class="field"><label for="program-discussion-first-message">First message</label><textarea id="program-discussion-first-message" rows="3" maxlength="8000" required placeholder="Write the first governance discussion message…" data-control="program-discussion-first-message">${escapeHtml(newDraft.body)}</textarea><p class="helper">Governance reply limit: 8,000 characters. Atomic retry identity remains a backend contract decision.</p></div><div class="row"><button class="button primary" type="submit">Preview synthetic discussion</button><button class="quiet-button" type="button" data-action="close-program-discussion-form">Cancel</button></div></form>` : ''}<div style="margin-top:11px">${topics.map((topic, index) => `<article class="discussion-topic"><div><strong>${escapeHtml(topic.title)}</strong><p>${escapeHtml(topic.preview)}</p><span class="helper">${escapeHtml(topic.owner)} · ${escapeHtml(topic.topic)}</span></div><button class="quiet-button" type="button" data-action="open-program-discussion" data-index="${index}" aria-expanded="${activeIndex === index}">${activeIndex === index ? 'Close thread' : 'Open thread'}</button></article>`).join('')}</div>${active ? `<div class="discussion-panel" style="margin-top:13px"><div class="spread"><div><h3>${escapeHtml(active.title)}</h3><p class="helper">${escapeHtml(active.owner)} · ${escapeHtml(currentProgram().code)} · ${escapeHtml(currentCycle().label)}</p></div><span class="scope-pill">Scoped thread</span></div>${active.messages.length ? active.messages.map((message) => `<article class="discussion-message"><div class="discussion-meta"><strong>${escapeHtml(message.sender)}</strong><time>${escapeHtml(dateLabel(message.time))} · ${escapeHtml(timeLabel(message.time))}</time></div><p>${escapeHtml(message.body)}</p></article>`).join('') : `<p class="helper" style="margin-top:10px">No replies in this thread yet.</p>`}<form class="field" data-form="program-discussion" data-index="${activeIndex}" style="margin-top:11px"><label for="program-discussion-reply">Add a coordination reply</label><textarea id="program-discussion-reply" rows="2" maxlength="8000" placeholder="Keep publication and quota decisions in their own workflows…" data-control="program-discussion-draft">${escapeHtml(replyDraft)}</textarea><div class="spread"><span class="helper">In-memory preview only · discussion does not change quota.</span><button class="button" type="submit">Add reply</button></div></form></div>` : ''}</section>`;
      }

      function renderPublications(kind) {

        const preview = rows.find((item) => item.id === state.publicationPreview);

ot decide admissions or quota. No presence, read ticks, uploads, or integrations are represented.</p></div></div></section>
          <section class="panel boundary-panel"><h2>Manual click scenarios</h2><p class="section-intro">Use the top navigation, scenario selector, and bottom variant switcher. Every action changes in-memory state only.</p><ol class="manual-list"><li>Open <code>?screen=program-workspace&amp;program=bsn&amp;tab=quota</code>; save a new capacity and note, then switch program or cycle to confirm isolation.</li><li>Open Registrar access controls; issue or revoke the single bundled grant to R. Villanueva with a reason, then inspect the version receipt and history. It grants no quota edit, case, or benchmark rights.</li><li>Open Program workspace → Discussions; draft a reply in one topic, switch topics and programs, then return to confirm only the matching program/cycle/topic/actor draft returns.</li><li>Open Applicant workspace; compare Guidance and Registrar preview actors. Guidance cannot read or reply to the Registrar inquiry; office-matched threads and counts change with the actor.</li><li>Switch Internal staff / With applicant, search subjects, and create a synthetic internal thread; no assigned-program support thread is opened here.</li><li>Choose <code>Error</code> or <code>Unknown send</code>; send a message, inspect its locked exact text and identity, retry the same identity, or explicitly abandon an unknown result with the non-recall warning.</li><li>Choose <code>Read-only</code> or select the Closed thread; history stays readable while the composer is unavailable.</li><li>Choose <code>Revoked</code>; all selected conversation list metadata, transcript, draft, and pending work disappear. Reset demo restores synthetic fixtures.</li><li>Choose <code>Loading</code>, then Complete synthetic load; choose <code>Empty</code> for a helpful no-thread state.</li><li>Open Applicant messages; verify only your eligible office inquiries appear, then create a demo inquiry, review its exact subject, audience, and first message, and cancel or confirm.</li></ol></section>

      function handleSend(threadId, retry = false) {
        const thread = getThread(threadId);
        const role = roleForScreen();
        const principalId = activeActorId(role);
        if (!thread || !canSend(thread, role, principalId)) return;
        const lane = role === 'applicant' ? 'applicant' : conversationLane(thread);
        const key = draftKeyFor(thread, lane, role, principalId);
        const scope = threadScopeKey(thread);
        const draft = state.threadDrafts.get(key) ?? { body: '', pending: null, feedback: '', sendState: 'idle' };
        let pending = draft.pending;
        if (!pending) {

            return;
          }
          pending = { id: `lab-send-${String(++state.sendSequence).padStart(4, '0')}`, body: draft.body, state: 'sending', attempts: 0 };

          return;

        const action = target.dataset.action;
        if (action === 'theme') {
          state.theme = state.theme === 'light' ? 'dark' : 'light';
          render();
          updateStatus(`${state.theme === 'dark' ? 'Dark' : 'Light'} theme selected.`);
        } else if (action === 'select-department') {
          state.departmentId = target.dataset.department;
          saveUrl(true);
          render();
          updateStatus(`Department selected: ${state.departmentId}. Choose a listed program to open its workspace.`);
        } else if (action === 'open-new-thread') {
          state.newConversationOpen = true;
          render();
          document.getElementById('new-thread-subject')?.focus();
        } else if (action === 'close-new-thread') {
          state.newConversationOpen = false;
          render();
        } else if (action === 'open-new-inquiry') {
          state.applicantInquiryOpen = true;
          state.applicantInquiryReviewKey = null;
          render();
          document.getElementById('new-inquiry-subject')?.focus();
        } else if (action === 'cancel-new-inquiry') {
          cancelApplicantInquiry();
        } else if (action === 'edit-new-inquiry') {
          state.applicantInquiryReviewKey = null;
          render();
          document.getElementById('new-inquiry-subject')?.focus();
        } else if (action === 'lane') {
          state.applicantLane = target.dataset.lane;
          state.staffReturnLane = state.applicantLane;
          state.newConversationOpen = false;
          state.mobileDetail = false;
          const list = relevantThreads('staff');
          if (!list.some((thread) => thread.id === state.selectedThreadId)) state.selectedThreadId = list[0]?.id ?? null;
          state.staffReturnThreadId = state.selectedThreadId;
          render();
          updateStatus(`${state.applicantLane === 'internal' ? 'Internal staff' : 'With applicant'} lane selected.`);
        } else if (action === 'select-thread') {
          state.selectedThreadId = target.dataset.thread;
          const selected = getThread(state.selectedThreadId);
          if (state.scenario === 'revoked' && selected) revokeThread(selected, roleForScreen(), activeActorId(roleForScreen()));
          if (roleForScreen() === 'staff') state.staffReturnThreadId = state.selectedThreadId;
          else state.applicantReturnThreadId = state.selectedThreadId;
          state.mobileDetail = true;
          render();
        } else if (action === 'back-list') {
          state.mobileDetail = false;
          render();
          document.getElementById('thread-search')?.focus();
        } else if (action === 'complete-loading') {
          state.loadingComplete = true;
          render();
          updateStatus('Synthetic load completed. Authorized fixture messages are available.');
        } else if (action === 'retry-send') {
          handleSend(target.dataset.thread, true);
        } else if (action === 'abandon-send') {
          abandonPendingSend(target.dataset.thread);
        } else if (action === 'reset-demo') {
          resetDemo();
        } else if (action === 'note-suggestion') {
          const key = quotaKey();
          const quota = findQuota();
          const current = state.quotaDrafts.get(key) ?? { capacity: String(quota.capacity), note: '' };
          const nextNote = current.note ? `${current.note}\n${target.dataset.text}` : target.dataset.text;
          state.quotaDrafts.set(key, { ...current, note: nextNote });
          render();
          document.getElementById('quota-note')?.focus();
        } else if (action === 'toggle-quota-discussion') {
          state.quotaDiscussionOpen = !state.quotaDiscussionOpen;
          render();
          updateStatus(state.quotaDiscussionOpen ? 'Quota discussion opened. Replies do not change quota.' : 'Quota discussion closed.');
        } else if (action === 'toggle-registrar-controls') {
          state.registrarControlsOpen = !state.registrarControlsOpen;
          render();
          updateStatus(state.registrarControlsOpen ? 'Recipient-scoped Registrar grant controls opened.' : 'Registrar grant controls closed.');
        } else if (action === 'open-program-discussion-form') {
          state.programNewDiscussionOpen = !state.programNewDiscussionOpen;
          render();
          if (state.programNewDiscussionOpen) document.getElementById('program-discussion-subject')?.focus();
        } else if (action === 'close-program-discussion-form') {
          state.programNewDiscussionOpen = false;
          render();
        } else if (action === 'open-program-discussion') {
          const index = Number(target.dataset.index);
          state.programDiscussionIndex = state.programDiscussionIndex === index ? null : index;
          render();
        } else if (action === 'preview-publication') {
          state.publicationPreview = target.dataset.id;
          render();
          document.querySelector('.publication-preview')?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
        } else if (action === 'close-publication') {
          state.publicationPreview = null;
          render();
        }
      });

      document.addEventListener('input', (event) => {
        const control = event.target.dataset.control;
        if (control === 'thread-search') {
          if (roleForScreen() === 'applicant') state.applicantSearch = event.target.value;
          else state.staffSearch = event.target.value;
          const cursor = event.target.selectionStart;
          const shell = event.target.closest('.conversation-shell') ?? event.target.closest('main');
          const refreshed = roleForScreen() === 'applicant' ? renderConversationWorkspace('applicant') : renderConversationWorkspace('staff');
          const temp = document.createElement('div');
          temp.innerHTML = refreshed;
          const main = document.querySelector('#view main');
          if (main && shell) {
            const newMain = temp.querySelector('main');
            if (newMain) main.replaceWith(newMain);
          }
          const newSearch = document.getElementById('thread-search');
          if (newSearch) {
            newSearch.focus();
            try { newSearch.setSelectionRange(cursor, cursor); } catch (_) { }
          }
          return;
        }
        if (control === 'message-draft') {
          setThreadDraft(getThread(event.target.dataset.thread), event.target.value);
          return;
        }
        if (control === 'new-subject') {
          setNewDraft('subject', event.target.value);
          return;
        }
        if (control === 'new-first-message') {
          setNewDraft('body', event.target.value);
          return;
        }
        if (control === 'new-inquiry-subject') {
          setApplicantInquiryDraft('subject', event.target.value);
          return;
        }
        if (control === 'new-inquiry-first-message') {
          setApplicantInquiryDraft('body', event.target.value);
          const preview = document.querySelector('.applicant-inquiry-form .inquiry-preview-body');
          if (preview) preview.textContent = event.target.value.trim() || 'Your exact first message will appear here before confirmation.';
          return;
        }
        if (control === 'quota-capacity') {
          saveQuotaDraft('capacity', event.target.value);
          return;
        }
        if (control === 'quota-note') {
          saveQuotaDraft('note', event.target.value);
          return;
        }
        if (control === 'quota-discussion-draft') {
          state.quotaDiscussionDraft = event.target.value;
          return;
        }
        if (control === 'program-discussion-draft') {
          state.programDiscussionDraft = event.target.value;
          return;
        }
        if (control === 'program-discussion-subject' || control === 'program-discussion-first-message') {
          const key = programNewDiscussionDraftKey();
          const draft = state.programNewDiscussionDrafts.get(key) ?? { subject: '', body: '' };
          draft[control === 'program-discussion-subject' ? 'subject' : 'body'] = event.target.value;
          state.programNewDiscussionDrafts.set(key, draft);
        }
      });

      document.addEventListener('change', (event) => {
        const control = event.target.dataset.control;
        if (control === 'staff-preview-actor') {
          switchStaffPreviewActor(event.target.value);
          return;
        }
        if (control === 'new-inquiry-office') {
          state.applicantInquiryTarget = event.target.value === 'Registrar' ? 'Registrar' : 'Guidance';
          state.applicantInquiryReviewKey = null;
          render();
          return;
        }
        if (control === 'scenario') {
          activateScenario(event.target.value);
          return;
        }
        if (control === 'overview-cycle') {
          state.cycleId = event.target.value;
          saveUrl(true);
          render();
          updateStatus(`Quota overview opened for ${currentCycle().label}.`);
          return;
        }
        if (control === 'program-select') {
          state.programId = event.target.value;
          state.departmentId = ({ bsn: 'health', bscs: 'computing', bacomm: 'arts' })[state.programId];
          state.programDiscussionIndex = null;
          state.programNewDiscussionOpen = false;
          state.quotaDiscussionOpen = false;
          state.registrarControlsOpen = false;
          state.publicationPreview = null;
          saveUrl(true);
          render();
          return;
        }
        if (control === 'program-cycle') {
          state.cycleId = event.target.value;
          state.programDiscussionIndex = null;
          state.programNewDiscussionOpen = false;
          state.quotaDiscussionOpen = false;
          state.registrarControlsOpen = false;
          state.publicationPreview = null;
          saveUrl(true);
          render();
          return;
        }
        if (control === 'conversation-program') {
          changeScopeOptions(event.target.value, state.cycleId);
          return;
        }
        if (control === 'conversation-cycle') {
          changeScopeOptions(state.programId, event.target.value);
          return;
        }
      });

      document.addEventListener('submit', (event) => {
        const form = event.target;
        const kind = form.dataset.form;
        if (!kind) return;
        event.preventDefault();
        if (kind === 'quota') {
          saveQuotaChange(event);
        } else if (kind === 'quota-discussion') {
          addDiscussionReply(event, 'quota');
        } else if (kind === 'program-discussion') {
          addDiscussionReply(event, 'program');
        } else if (kind === 'new-thread') {
          const key = createDraftKey('internal');
          const draft = state.newConversationDrafts.get(key) ?? { subject: '', body: '' };
          if (!draft.subject.trim() || !draft.body.trim()) {
            updateStatus('A subject and first message are both required for the synthetic preview.');
            return;
          }
          createSyntheticThread(draft.subject.trim(), draft.body.trim());
        } else if (kind === 'review-applicant-inquiry') {
          const key = applicantInquiryDraftKey();
          const draft = state.applicantInquiryDrafts.get(key) ?? { subject: '', body: '' };
          if (!draft.subject.trim() || !draft.body.trim()) {
            updateStatus('A subject and first message are required before reviewing an inquiry.');
            return;
          }
          state.applicantInquiryReviewKey = key;
          render();
        } else if (kind === 'create-applicant-inquiry') {
          createSyntheticApplicantInquiry();
        } else if (kind === 'registrar-grant') {
          const action = event.submitter?.value;
          const expectedVersion = Number(form.dataset.version);
          const reason = new FormData(form).get('reason');
          changeRegistrarGrant(action, expectedVersion, String(reason ?? ''));
        } else if (kind === 'program-new-discussion') {
          const key = programNewDiscussionDraftKey();
          const draft = state.programNewDiscussionDrafts.get(key) ?? { subject: '', body: '' };
          if (!draft.subject.trim() || !draft.body.trim()) {
            updateStatus('A subject and first message are both required for the synthetic governance preview.');
            return;
          }
          const actor = staffPreviewActor();
          const topicId = `synthetic-program-discussion-${++state.createdSequence}`;
          findProgramDiscussion().unshift({
            id: topicId,
            title: draft.subject.trim(),
            owner: `${actor.name} · ${actor.office} · synthetic`,
            preview: draft.body.trim(),
            topic: 'Program governance',
            messages: [{ sender: `${actor.name} · ${actor.office}`, self: true, time: nowIso(), body: draft.body.trim() }],
          });
          state.programDiscussionIndex = 0;
          state.programNewDiscussionOpen = false;
          state.programNewDiscussionDrafts.set(key, { subject: '', body: '' });
          render();
          updateStatus('Synthetic governance discussion preview opened. The backend atomic-create contract is still required; no request was made.');
        } else if (kind === 'send-message') {
          handleSend(form.dataset.thread, false);
        }
      });

      document.addEventListener('keydown', (event) => {
        if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && event.target.matches('[data-control="message-draft"]')) {
          event.preventDefault();
          handleSend(event.target.dataset.thread, false);
        }
      });

      window.addEventListener('popstate', () => {
        const params = new URLSearchParams(location.search);
        const screen = params.get('screen');
        const validScreen = screenNames.includes(screen) ? screen : 'organization';
        state.variant = params.get('variant') === 'B' ? 'B' : 'A';
        const program = params.get('program');
        if (programs.some((entry) => entry.id === program)) state.programId = program;
        const cycle = params.get('cycle');
        const department = params.get('department');
        if (['health', 'computing', 'arts'].includes(department)) state.departmentId = department;
        if (cycles.some((entry) => entry.id === cycle)) state.cycleId = cycle;
        const tab = params.get('tab');
        if (['overview', 'quota', 'discussions', 'announcements', 'policies', 'benchmarks'].includes(tab)) state.programTab = tab;
        resetScreenView(validScreen);
        render();
      });

      Object.defineProperties(window, {
        labState: {
          configurable: false,
          enumerable: true,
          value: Object.freeze({
            get screen() { return state.screen; },
            get variant() { return state.variant; },
            get scenario() { return state.scenario; },
            get programId() { return state.programId; },
            get cycleId() { return state.cycleId; },
            get selectedThreadId() {
              const thread = getCurrentThread();
              return thread && canRead(thread, roleForScreen()) ? thread.id : null;
            },
            snapshot() {
              const thread = getCurrentThread();
              const visibleThread = thread && canRead(thread, roleForScreen()) ? thread : null;
              const quota = findQuota();
              return {
                screen: state.screen,
                variant: state.variant,
                scenario: state.scenario,
                programId: state.programId,
                cycleId: state.cycleId,
                programTab: state.programTab,
                selectedThreadId: visibleThread?.id ?? null,
                selectedThreadStatus: visibleThread ? effectiveStatus(visibleThread) : null,
                selectedThreadMessageCount: visibleThread ? visibleThread.messages.length : null,
                quota: { capacity: quota.capacity, committed: quota.committed, remaining: quotaRemaining(quota) },
                status: state.status,
                screens: [...screenNames],
                scenarios: ['normal', 'loading', 'empty', 'read-only', 'error', 'unknown', 'revoked'],
              };
            },
          }),
        },
      });

      const initialProgram = search.get('program');
      const initialCycle = search.get('cycle');
      const initialTab = search.get('tab');
      if (programs.some((program) => program.id === initialProgram)) state.programId = initialProgram;
      if (cycles.some((cycle) => cycle.id === initialCycle)) state.cycleId = initialCycle;
      if (['overview', 'quota', 'discussions', 'announcements', 'policies', 'benchmarks'].includes(initialTab)) state.programTab = initialTab;

      const requestedThread = search.get('thread');
      if (requestedThread && getThread(requestedThread)) state.selectedThreadId = requestedThread;
      if (state.screen === 'applicant-messages') state.selectedThreadId = relevantThreads('applicant')[0]?.id ?? null;
      document.documentElement.dataset.theme = state.theme;
      render();
    })();
  </script>
</body>
</html>
