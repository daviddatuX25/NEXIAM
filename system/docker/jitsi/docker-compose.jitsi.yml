services:
  web:
    image: jitsi/web:stable-9823
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
      - "127.0.0.1:${HTTPS_PORT:-18443}:443"
    volumes:
      - ./config/web:/config
      - ./config/web-crontabs:/var/spool/cron/crontabs
      - ./config/transcripts:/usr/share/jitsi-meet/transcripts
    environment:
      PUBLIC_URL: ${JITSI_PUBLIC_URL:?Set JITSI_PUBLIC_URL}
      ENABLE_AUTH: "1"
      AUTH_TYPE: jwt
      ENABLE_GUESTS: "0"
      ENABLE_LOBBY: "1"
      ENABLE_PREJOIN_PAGE: "1"
      ENABLE_WELCOME_PAGE: "0"
      ENABLE_P2P: ${JITSI_ENABLE_P2P:-0}
      ENABLE_TRANSCRIPTIONS: "0"
      DISABLE_RECAPTCHA: "1"
      XMPP_SERVER: prosody
      XMPP_DOMAIN: ${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_AUTH_DOMAIN: auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_GUEST_DOMAIN: guest.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_BOSH_URL_BASE: http://prosody:5280
      JICOFO_AUTH_USER: focus
      JVB_AUTH_USER: jvb
      TZ: ${TZ:-UTC}
    depends_on:
      - prosody
    networks:
      - jitsi

  prosody:
    image: jitsi/prosody:stable-9823
    restart: unless-stopped
    expose:
      - "5222"
      - "5347"
      - "5280"
    volumes:
      - ./config/prosody:/config
      - ./prosody-plugins-custom:/prosody-plugins-custom
    environment:
      XMPP_DOMAIN: ${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_AUTH_DOMAIN: auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal.auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_GUEST_DOMAIN: guest.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      AUTH_TYPE: jwt
      ENABLE_AUTH: "1"
      ENABLE_GUESTS: "0"
      ENABLE_LOBBY: "1"
      ENABLE_XMPP_WEBSOCKET: "1"
      JWT_APP_ID: ${JITSI_APP_ID:-nexiam}
      JWT_APP_SECRET: ${JITSI_APP_SECRET:?Set JITSI_APP_SECRET}
      JWT_ACCEPTED_ISSUERS: ${JITSI_APP_ID:-nexiam}
      JWT_ACCEPTED_AUDIENCES: ${JITSI_JWT_AUDIENCE:?Set JITSI_JWT_AUDIENCE}
      JWT_ALLOW_EMPTY: "0"
      XMPP_MUC_MODULES: "nexiam_admission"
      XMPP_MUC_CONFIGURATION: >-
        nexiam_admission_url = "http://app:8000/consultation/internal/jitsi/admission",
        nexiam_presence_url = "http://app:8000/consultation/internal/jitsi/presence",
        nexiam_admission_secret = "${JITSI_ADMISSION_SECRET:?Set JITSI_ADMISSION_SECRET}",
        nexiam_admission_timeout = 3
      XMPP_MODULES: "nexiam_control,persistent_lobby"
      XMPP_CONFIGURATION: >-
        nexiam_muc_component = "muc.${JITSI_DOMAIN:?Set JITSI_DOMAIN}",
        nexiam_admission_url = "http://app:8000/consultation/internal/jitsi/admission",
        nexiam_presence_url = "http://app:8000/consultation/internal/jitsi/presence",
        nexiam_admission_secret = "${JITSI_ADMISSION_SECRET:?Set JITSI_ADMISSION_SECRET}",
        nexiam_control_token = "${JITSI_CONTROL_TOKEN:?Set JITSI_CONTROL_TOKEN}",
        nexiam_admission_timeout = 3
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?Set JICOFO_AUTH_PASSWORD}
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?Set JVB_AUTH_PASSWORD}
      TZ: ${TZ:-UTC}
    networks:
      - jitsi

  jicofo:
    image: jitsi/jicofo:stable-9823
    restart: unless-stopped
    volumes:
      - ./config/jicofo:/config
    environment:
      XMPP_SERVER: prosody
      XMPP_AUTH_DOMAIN: auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal.auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_DOMAIN: ${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      JICOFO_AUTH_USER: focus
      JICOFO_AUTH_PASSWORD: ${JICOFO_AUTH_PASSWORD:?Set JICOFO_AUTH_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?Set JVB_AUTH_PASSWORD}
      TZ: ${TZ:-UTC}
    depends_on:
      - prosody
    networks:
      - jitsi

  jvb:
    image: jitsi/jvb:stable-9823
    restart: unless-stopped
    ports:
      - "${JVB_PORT:-10000}:10000/udp"
    volumes:
      - ./config/jvb:/config
    environment:
      XMPP_SERVER: prosody
      XMPP_DOMAIN: ${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_AUTH_DOMAIN: auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_INTERNAL_MUC_DOMAIN: internal.auth.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      XMPP_MUC_DOMAIN: muc.${JITSI_DOMAIN:?Set JITSI_DOMAIN}
      JVB_AUTH_USER: jvb
      JVB_AUTH_PASSWORD: ${JVB_AUTH_PASSWORD:?Set JVB_AUTH_PASSWORD}
      JVB_BREWERY_MUC: jvbbrewery
      JVB_ADVERTISE_IPS: ${JVB_ADVERTISE_IPS:?Set public/NAT JVB_ADVERTISE_IPS}
      JVB_PORT: "10000"
      TZ: ${TZ:-UTC}
    depends_on:
      - prosody
    networks:
      - jitsi

networks:
  jitsi:
    name: nexiam-system_default
    external: true
