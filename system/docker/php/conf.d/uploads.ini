; Answer Sheet ZIP imports accept files up to 100 MiB.
; Leave multipart overhead above the application file limit.
upload_max_filesize = 100M
post_max_size = 128M
; OMR normalization evaluates up to four quarter-turn rasters of a 2060x3144 page.
; Keep app and queue workers above the GD peak instead of exhausting a capture job.
memory_limit = 512M
