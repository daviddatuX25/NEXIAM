<!--
  Safelist: Tailwind classes used in print templates.
  Tailwind v4 scans this file to ensure these utilities are included in the build,
  even though the actual template HTML lives in the database.
  Keep in sync with:
    - database/seeders/ResultSheetTemplateSeeder.php
    - database/seeders/AdmissionSlipTemplateSeeder.php
    - app/Services/ResultSheetTemplateService.php (buildScoresRows)
    - app/Services/AdmissionSlipTemplateService.php (photoPlaceholder, qrPlaceholder)
-->
<!-- Result sheet template classes (Default template) -->
<div class="bg-primary px-4 py-3 py-2 py-1.5 pt-3 pb-1 pb-2 flex justify-between justify-center items-center items-end text-white text-right font-bold font-semibold font-medium text-left text-center grid grid-cols-2 gap-2 border-b border-collapse w-full border-foreground/20 rounded p-4 space-y-3 text-base text-xs text-sm text-muted-foreground mt-0.5 leading-relaxed pt-4 w-24 border-border/50 py-1.5 print-template--dual print-template--half scores-rows-placeholder">
  <table class="w-full text-sm border-collapse">
    <thead><tr><th class="text-left py-1.5">Pillar</th><th class="text-right py-1.5">Score</th><th class="text-right py-1.5">%</th></tr></thead>
  </table>
  <div class="border-b w-24">&nbsp;</div>
  <p class="text-xs text-center">Counselor</p>
</div>

<!-- Admission slip classes -->
<div class="border rounded p-4 space-y-3 text-center text-base text-xs text-sm text-muted-foreground font-bold leading-relaxed w-full flex justify-between items-center gap-4">
  <div class="photo-placeholder" style="width:120px;height:150px;border:2px dashed #9ca3af;display:inline-block;text-align:center;line-height:150px;color:#9ca3af;font-size:10px;">Photo</div>
  <div class="qr-placeholder" style="width:80px;height:80px;border:2px dashed #9ca3af;display:inline-block;text-align:center;line-height:80px;color:#9ca3af;font-size:10px;">QR Code</div>
</div>

<!-- Additional classes that admin-written templates might use -->
<div class="p-2 p-6 m-0 mx-auto my-2 mb-4 mt-8 max-w-sm max-w-md max-w-lg max-w-xl max-w-2xl
     text-left text-center text-right text-justify font-normal font-semibold italic underline
     bg-white bg-background bg-card bg-muted bg-primary text-white text-black
     border-t border-l border-r border-dashed border-2 border-4
     rounded-lg rounded-md rounded-sm shadow shadow-md shadow-lg
     grid grid-cols-2 grid-cols-3 gap-2 gap-4
     h-auto min-h-0 overflow-hidden overflow-auto
     print:hidden print:block print:p-0 print:m-0
     absolute relative top-0 left-0 right-0 bottom-0 z-10">
</div>

<!-- Print media utilities -->
<div class="print:hidden print:block print:p-0 print:p-4 print:p-6 print:m-0 print:max-w-none print:border print:rounded-none print:text-black print:bg-white"></div>
